<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Privlee - Private, discreet connection for adults</title>
    <meta name="description" content="A private, pseudonym-only space for adults seeking discreet connection. No real names, photos blurred by default, and a one-tap panic button." />
    <meta name="theme-color" content="#f7f1e6" />

    <!-- How a shared link looks. These are the defaults a crawler sees before any script runs.
         og:url and og:image need the real domain and a designed image, so they are added once
         those exist. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Privlee" />
    <meta property="og:title" content="Privlee - Private, discreet connection for adults" />
    <meta property="og:description" content="A private, pseudonym-only space for adults seeking discreet connection." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Privlee - Private, discreet connection for adults" />
    <meta name="twitter:description" content="A private, pseudonym-only space for adults seeking discreet connection." />

    <!-- Tells search engines what the site is. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Privlee",
        "description": "A private, pseudonym-only space for adults seeking discreet connection."
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
