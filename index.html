<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Privlee - Private, discreet connection for adults</title>
    <meta name="description" content="A private, pseudonym-only space for adults seeking discreet connection. No real names, photos blurred by default, and a one-tap panic button." />
    <meta name="theme-color" content="#f7f1e6" />
    <meta name="application-name" content="Privlee" />
    <meta name="author" content="Privlee" />

    <!-- How a shared link looks. These are the defaults a crawler sees before any script runs; the
         build adds og:url per page. og:image still needs a designed 1200x630 picture. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Privlee" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="Privlee - Private, discreet connection for adults" />
    <meta property="og:description" content="A private, pseudonym-only space for adults seeking discreet connection." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Privlee - Private, discreet connection for adults" />
    <meta name="twitter:description" content="A private, pseudonym-only space for adults seeking discreet connection." />

    <!-- Tells search engines what the site is. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Privlee",
        "description": "A private, pseudonym-only space for adults seeking discreet connection."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
